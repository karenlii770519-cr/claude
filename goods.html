blank.needsUpdate = true;

function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('圖片載入失敗：' + src)); im.src = src; });
}
function toCanvas(im, maxSide = 1400) {
  const s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  c.getContext('2d', { willReadFrequently: true }).drawImage(im, 0, 0, c.width, c.height);

}
// 雷射卡白墨：深且不透明的地方上白墨（同 demo 的算法）
function whiteFromDark(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const lum = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
    const o = p[i + 3] / 255 * (1 - lum / 255);
    const a = Math.min(1, Math.max(0, (o - 0.35) / 0.3));
    p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.round(a * 255);
  }
  x.putImageData(d, 0, 0); return c;
}
// 壓克力：從邊緣把白底填成透明，留下角色＋白邊的外型
// 亮部上白墨：人物（亮色）不透光，深色底紋透出雷射
function whiteFromLight(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const lum = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
    const a = Math.min(1, Math.max(0, (lum - 70) / 60)) * (p[i + 3] / 255);
    p[i] = p[i + 1] = p[i + 2] = 0; p[i + 3] = Math.round(a * 255);
  }
  x.putImageData(d, 0, 0); return c;
}
// 吸管套：把折線那幾排、中間主體以外的虛線擦掉
function eraseFoldDashes(src, frac) {
  const w = src.width, h = src.height, x = src.getContext('2d', { willReadFrequently: true });
  const d = x.getImageData(0, 0, w, h), p = d.data, cx = w >> 1;
  const y0 = Math.max(0, Math.round(h * frac - h * 0.012)), y1 = Math.min(h - 1, Math.round(h * frac + h * 0.012));
  for (let y = y0; y <= y1; y++) {
    let l = cx, r = cx;
    while (l > 0 && p[(y * w + l - 1) * 4 + 3] > 20) l--;
    while (r < w - 1 && p[(y * w + r + 1) * 4 + 3] > 20) r++;
    for (let i = 0; i < w; i++) if (i < l || i > r) p[(y * w + i) * 4 + 3] = 0;
  }
  x.putImageData(d, 0, 0); return src;
}
function cutWhiteBackground(src, noFill) {
  const w = src.width, h = src.height;
  const x = src.getContext('2d', { willReadFrequently: true });
  const d = x.getImageData(0, 0, w, h), p = d.data;
  const seen = new Uint8Array(w * h), stack = [];
  const isBg = i => p[i * 4] > 238 && p[i * 4 + 1] > 238 && p[i * 4 + 2] > 238;
  for (let i = 0; i < w; i++) { stack.push(i, (h - 1) * w + i); }
  for (let j = 0; j < h; j++) { stack.push(j * w, j * w + w - 1); }
  while (stack.length) {
    const i = stack.pop();
    if (seen[i] || !isBg(i)) continue;
    seen[i] = 1; p[i * 4 + 3] = 0;
    const cx = i % w, cy = (i / w) | 0;
    if (cx > 0) stack.push(i - 1); if (cx < w - 1) stack.push(i + 1);
    if (cy > 0) stack.push(i - w); if (cy < h - 1) stack.push(i + w);
  }
  // 補洞：邊緣淡色區塊被誤當背景時，每一列左右邊界之間都補回不透明（壓克力不做，保留刀模外型）
  if (!noFill) {
  for (let y = 0; y < h; y++) {
    let l = -1, r = -1;
    for (let i = 0; i < w; i++) if (p[(y * w + i) * 4 + 3] > 0) { if (l < 0) l = i; r = i; }
    for (let i = l; i >= 0 && i <= r; i++) p[(y * w + i) * 4 + 3] = 255;
  }
  for (let i = 0; i < w; i++) {
    let t = -1, b = -1;
    for (let y = 0; y < h; y++) if (p[(y * w + i) * 4 + 3] > 0) { if (t < 0) t = y; b = y; }
    for (let y = t; y >= 0 && y <= b; y++) p[(y * w + i) * 4 + 3] = 255;
  }
  }
  x.putImageData(d, 0, 0);

}
// 透明邊：刀模內但沒有印刷（近白色）的地方變透明，只留印刷圖
function clearMargin(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(src, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data, w = c.width, h = c.height;
  // 從透明背景往內，把相連的近白色／淺灰（刀模線）都清掉
  const seen = new Uint8Array(w * h), st = [];

  for (let i = 0; i < w * h; i++) if (p[i * 4 + 3] === 0) st.push(i);
  while (st.length) {
    const i = st.pop(); if (seen[i]) continue; seen[i] = 1;
    if (p[i * 4 + 3] !== 0) { if (!light(i)) continue; p[i * 4 + 3] = 0; }
    const cx = i % w, cy = (i / w) | 0;
    if (cx > 0) st.push(i - 1); if (cx < w - 1) st.push(i + 1); if (cy > 0) st.push(i - w); if (cy < h - 1) st.push(i + w);
  }

// 從刀模外型取輪廓（Moore 追邊＋簡化），並找出上方的吊孔
function acrylicOutline(src, w, h) {
  const S = 640, sc = S / Math.max(src.width, src.height);
  const W = Math.max(2, Math.round(src.width * sc)), H = Math.max(2, Math.round(src.height * sc));

  const x = cv.getContext('2d', { willReadFrequently: true }); x.drawImage(src, 1, 1, W, H);

  const on = (i, j) => i >= 0 && j >= 0 && i < GW && j < GH && d[(j * GW + i) * 4 + 3] > 100;
  // 吊孔：外型內部、上方 30% 的淺色小圓區
  let hole = null;

    // 吊耳＝最上方「連續好幾格」的那一列（避開圖片邊緣的雜點）
    let topY = -1, topX = 0, cnt = 0;
    for (let j = 0; j < GH && topY < 0; j++) { let run = 0, best = 0; for (let i = 3; i < GW - 3; i++) { run = on(i, j) ? run + 1 : 0; best = Math.max(best, run); } if (best >= 4) topY = j; }

    const outside = new Uint8Array(GW * GH), ost = [0];

    const lt = (i, j) => { const k = (j * GW + i) * 4; if (!on(i, j)) return !outside[j * GW + i]; return d[k] > 225 && d[k + 1] > 225 && d[k + 2] > 225; };
    for (let j = 1; j < GH * 0.35; j++) for (let i = 1; i < GW - 1; i++) {
      if (!lt(i, j) || lab[j * GW + i] >= 0) continue;

      while (st.length) { const [a, b] = st.pop(); pts.push([a, b]);
        for (const [da, db] of [[1,0],[-1,0],[0,1],[0,-1]]) { const na = a + da, nb = b + db;
          if (na < 0 || nb < 0 || na >= GW || nb >= GH || outside[nb * GW + na]) { touches = true; continue; }

      const n = pts.length; if (touches || n < 4 || n > GW * GH * 0.01) continue;
      let sx = 0, sy = 0, x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
      for (const [a, b] of pts) { sx += a; sy += b; x0 = Math.min(x0, a); x1 = Math.max(x1, a); y0 = Math.min(y0, b); y1 = Math.max(y1, b); }

    if (!best) best = { x: topX, y: topY + Math.max(GW, GH) * 0.03, r: Math.max(GW, GH) * 0.012 };

const cards = [];
async function build(item, el, index) {
  const view = el.querySelector('.view');
  const im = await loadImage(item.art);
  let art = toCanvas(im);
  const aspect = art.width / art.height;
  // 實際尺寸（mm）：卡片 63×88，其他依圖片比例
  let h = item.kind === 'acrylic' ? 62 : item.kind === 'sleeve' ? 120 : 88, w = h * aspect;
  if (item.kind === 'laser') { w = 63; h = 88; }
  let c_extraTop = 0;
  if (item.kind === 'acrylic') {
    item.cutSrc = cutWhiteBackground(toCanvas(im), true);
    item.printOnly = clearMargin(item.cutSrc);
    art = item.cutSrc;
  }
  if (item.kind === 'paper') art = cutWhiteBackground(art);
  if (item.kind === 'sleeve') art = eraseFoldDashes(art, item.fold ?? 0.5);
  const thick = item.kind === 'acrylic' ? 3 : 0.35;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x888fa0, 0.6));
  const L = (() => { const a = deg(-35), e = deg(32); return new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)).multiplyScalar(Math.max(w, h) * 0.85); })();
  const pl = new THREE.PointLight(0xffffff, 2.2, 0, 0); pl.position.copy(L); scene.add(pl);
  const outer = new THREE.Group(), inner = new THREE.Group();
  inner.position.set(-w / 2, h / 2, 0); outer.add(inner); scene.add(outer);
  const filmIdx = Math.max(0, FILMS.findIndex(f => f.id === (item.film || 'holo')));
  const printT = tex(art, true);

  if (item.kind === 'laser') {
    const shape = roundRect(w, h, 3);
    const side = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false, curveSegments: 12 }), new THREE.MeshStandardMaterial({ color: 0xf5f3ef, roughness: 0.85 }));
    side.position.z = -thick / 2; inner.add(side);
    const whiteSrc = item.mask ? toCanvas(await loadImage(item.mask)) : art;
    const front = new THREE.Mesh(new THREE.ShapeGeometry(shape, 12), material(printT, tex(whiteFromDark(whiteSrc), false), { w, h, light: L, substrate: filmIdx }));
    front.position.z = thick / 2 + 0.01; inner.add(front);
    if (item.back) {
      const bc = toCanvas(await loadImage(item.back));
      const bg = new THREE.ShapeGeometry(shape, 12); bg.rotateY(Math.PI); bg.translate(w, 0, 0);
      const back = new THREE.Mesh(bg, material(tex(bc, true), null, { w, h, light: L, flipX: w, gloss: 0.03 }));
      back.position.z = -thick / 2 - 0.01; inner.add(back);
    }
  } else if (item.kind === 'paper') {
    const shape = rect(w, h);
    const opt = { w, h, light: L, cut: true, gloss: 0.03 };
    inner.add(new THREE.Mesh(new THREE.ShapeGeometry(shape), material(printT, null, { ...opt, side: THREE.FrontSide })));
    inner.add(new THREE.Mesh(new THREE.ShapeGeometry(shape), material(tex(alphaMask(art), true), null, { ...opt, side: THREE.BackSide })));
  } else if (item.kind === 'sleeve') {
    // 對折：下半＝正面（角色），上半沿虛線往後折到背面
    const yf = h * (item.fold ?? 0.5);
    const half = (y0, y1) => { const sh = new THREE.Shape(); sh.moveTo(0, -y0); sh.lineTo(w, -y0); sh.lineTo(w, -y1); sh.lineTo(0, -y1); sh.closePath(); return new THREE.ShapeGeometry(sh); };
    const whiteP = tex(alphaMask(art), true);
    const opt = { w, h, light: L, cut: true, gloss: 0.03 };
    const lower = half(yf, h), upper = half(0, yf);
    // 折線當鉸鏈，兩片各張開一點，下緣留出放吸管的空隙
    const open = deg(item.open ?? 5);
    const front = new THREE.Group(); front.position.set(0, -yf, 0); front.rotation.x = -open; inner.add(front);
    const lo1 = new THREE.Mesh(lower, material(printT, null, { ...opt, side: THREE.FrontSide })); lo1.position.y = yf;
    const lo2 = new THREE.Mesh(lower, material(whiteP, null, { ...opt, side: THREE.BackSide })); lo2.position.y = yf;
    front.add(lo1, lo2);
    const pivot = new THREE.Group(); pivot.position.set(0, -yf, 0); pivot.rotation.x = Math.PI + open; inner.add(pivot);
    const up1 = new THREE.Mesh(upper, material(printT, null, { ...opt, side: THREE.FrontSide })); up1.position.y = yf;
    const up2 = new THREE.Mesh(upper, material(whiteP, null, { ...opt, side: THREE.BackSide })); up2.position.y = yf;

    // 所以正面隔著壓克力看到正常的圖，翻到背面看到白墨；吊孔穿一個開口圈（金屬小圓環）

}

function bind(c) {
  const v = c.view; let down = null;
  const aim = e => { const r = v.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * 2 - 1, y = -((e.clientY - r.top) / r.height * 2 - 1); c.ty = deg(28) * Math.max(-1, Math.min(1, x)); c.tx = -deg(18) * Math.max(-1, Math.min(1, y)); };

function flip(c, to) {

  c.el.querySelector('.flip').textContent = c.flipTo > 0.5 ? '翻回正面' : '翻面';
}
document.getElementById('flipAll').addEventListener('click', e => {
  const any = cards.some(c => c.flipTo < 0.5);
  cards.forEach((c, i) => setTimeout(() => flip(c, any ? 1 : 0), i * 70));
  e.currentTarget.textContent = any ? '全部翻回正面' : '全部翻面';
});

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(now) {

  const t = now / 1000;

    const ay = c.hover ? c.ty : (reduce ? 0 : deg(16) * Math.sin(t * 0.7 + c.phase));

const root = document.getElementById('groups');
let n = 0; const jobs = [];
for (const g of GROUPS) {
  const sec = document.createElement('section'); sec.className = 'group';
  sec.innerHTML = `<h2>${g.title}</h2><p class="sub">${g.sub}</p><div class="grid"></div>`;
  root.appendChild(sec);
  const grid = sec.querySelector('.grid');
  for (const it of g.items) {
    const fig = document.createElement('figure'); fig.className = 'card';
    fig.innerHTML = `<div class="view" role="button" tabindex="0" aria-label="${it.label}（${it.note}）：點一下翻面"><span class="ld">載入中…</span></div><figcaption><span><b>${it.label}</b><small>${it.note}</small></span><button type="button" class="flip">翻面</button></figcaption>`;
    grid.appendChild(fig);
    const i = n++;
    jobs.push(build(it, fig, i).catch(err => { fig.querySelector('.ld').textContent = '載入失敗'; console.error(err); }));
  }
}
requestAnimationFrame(frame);
