<script type="module">
import * as THREE from 'three';
import { FILMS, VERT, FRAG } from './js/goods-shaders.js';

const W = 'img/works/';
// mask（選填）＝白墨版：黑色＝上白墨不透光，白色或透明＝透出雷射膜
// kind: laser＝雷射卡（整張是雷射膜，深色處自動當白墨）／sleeve＝對折吸管套（霧面紙，依透明背景裁切）／acrylic＝壓克力（白底自動去背）
const GROUPS = [
  { title: '吸管套', sub: '霧面紙，沿虛線對折；正面是角色，翻過來是另一半的 Logo，內側白色。', items: [
    { label: '明日方舟 吸管套', note: '霧面紙・對折', kind: 'sleeve', fold: 0.494, art: W+'arknights-haoxiang/card-04.png' },
    { label: '明日方舟 吸管套', note: '霧面紙・對折', kind: 'sleeve', fold: 0.494, art: W+'arknights-haoxiang/card-05.png' },
    { label: '明日方舟 吸管套', note: '霧面紙・對折', kind: 'sleeve', fold: 0.494, art: W+'arknights-haoxiang/card-06.png' },
    { label: '明日方舟 吸管套', note: '霧面紙・對折', kind: 'sleeve', fold: 0.494, art: W+'arknights-haoxiang/card-07.png' },
  ]},
  { title: '壓克力吊飾', sub: '單面印刷＋白墨打底；翻到背面只會看到白墨。', items: [
    { label: '碧藍航線 壓克力吊飾', note: '3mm 壓克力', kind: 'acrylic', art: W+'azurlane-shabu/acrylic-charm-01.jpg' },
    { label: '碧藍航線 壓克力吊飾', note: '3mm 壓克力', kind: 'acrylic', art: W+'azurlane-shabu/acrylic-charm-02.jpg' },
    { label: '蔚藍檔案 壓克力吊飾', note: '3mm 壓克力', kind: 'acrylic', art: W+'bluearchive-festival/acrylic-charm-01.jpg' },
    { label: '蔚藍檔案 壓克力吊飾', note: '3mm 壓克力', kind: 'acrylic', art: W+'bluearchive-festival/acrylic-charm-02.jpg' },
  ]},
];

const deg = THREE.MathUtils.degToRad;
const canvasEl = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
} catch (e) {
  document.getElementById('err').style.display = 'block';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0, 0);
renderer.setScissorTest(true);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const blank = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1);
blank.needsUpdate = true;

function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('圖片載入失敗：' + src)); im.src = src; });
}
function toCanvas(im, maxSide = 1400) {
  const s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  c.getContext('2d', { willReadFrequently: true }).drawImage(im, 0, 0, c.width, c.height);
  return c;
}
// 雷射卡白墨：深且不透明的地方上白墨（同 demo 的算法）
function whiteFromDark(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const lum = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
    const o = p[i + 3] / 255 * (1 - lum / 255);
    const a = Math.min(1, Math.max(0, (o - 0.35) / 0.3));
    p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.round(a * 255);
  }
  x.putImageData(d, 0, 0); return c;
}
// 壓克力：從邊緣把白底填成透明，留下角色＋白邊的外型
// 亮部上白墨：人物（亮色）不透光，深色底紋透出雷射
function whiteFromLight(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const lum = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
    const a = Math.min(1, Math.max(0, (lum - 70) / 60)) * (p[i + 3] / 255);
    p[i] = p[i + 1] = p[i + 2] = 0; p[i + 3] = Math.round(a * 255);
  }
  x.putImageData(d, 0, 0); return c;
}
function cutWhiteBackground(src) {
  const w = src.width, h = src.height;
  const x = src.getContext('2d', { willReadFrequently: true });
  const d = x.getImageData(0, 0, w, h), p = d.data;
  const seen = new Uint8Array(w * h), stack = [];
  const isBg = i => p[i * 4] > 238 && p[i * 4 + 1] > 238 && p[i * 4 + 2] > 238;
  for (let i = 0; i < w; i++) { stack.push(i, (h - 1) * w + i); }
  for (let j = 0; j < h; j++) { stack.push(j * w, j * w + w - 1); }
  while (stack.length) {
    const i = stack.pop();
    if (seen[i] || !isBg(i)) continue;
    seen[i] = 1; p[i * 4 + 3] = 0;
    const cx = i % w, cy = (i / w) | 0;
    if (cx > 0) stack.push(i - 1); if (cx < w - 1) stack.push(i + 1);
    if (cy > 0) stack.push(i - w); if (cy < h - 1) stack.push(i + w);
  }
  x.putImageData(d, 0, 0);
  return src;
}
function alphaMask(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { p[i] = p[i + 1] = p[i + 2] = 255; }
  x.putImageData(d, 0, 0); return c;
}
function tex(img, srgb) {
  const t = new THREE.CanvasTexture(img);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = maxAniso; t.needsUpdate = true; return t;
}
function roundRect(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(r, 0); s.lineTo(w - r, 0); s.quadraticCurveTo(w, 0, w, -r);
  s.lineTo(w, -(h - r)); s.quadraticCurveTo(w, -h, w - r, -h);
  s.lineTo(r, -h); s.quadraticCurveTo(0, -h, 0, -(h - r));
  s.lineTo(0, -r); s.quadraticCurveTo(0, 0, r, 0); s.closePath(); return s;
}
function rect(w, h) { const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(w, 0); s.lineTo(w, -h); s.lineTo(0, -h); s.closePath(); return s; }

function material(print, white, opt) {
  return new THREE.ShaderMaterial({
    vertexShader: VERT, fragmentShader: FRAG, side: opt.side ?? THREE.DoubleSide, transparent: true,
    uniforms: {
      uPrint: { value: print }, uFoil: { value: blank }, uWhite: { value: white || blank },
      uRegion: { value: new THREE.Vector4(0, 0, opt.w, opt.h) },
      uLightPos: { value: opt.light.clone() }, uLightIntensity: { value: 1 },
      uFilmColor: { value: FILMS.map(f => new THREE.Vector3(...f.color)) },
      uFilmKind: { value: FILMS.map(f => f.kind) }, uFilmRough: { value: FILMS.map(f => f.roughness) },
      uAcrylic: { value: opt.acrylic ? 1 : 0 }, uPaperGloss: { value: opt.gloss ?? 0.1 },
      uSubstrate: { value: opt.substrate ?? -1 }, uInkClarity: { value: 0.45 },
      uCut: { value: opt.cut ? 1 : 0 }, uSheet: { value: opt.sheet ?? 0 },
      uFlipX: { value: opt.flipX || 0 },
    },
  });
}

const cards = [];
async function build(item, el, index) {
  const view = el.querySelector('.view');
  const im = await loadImage(item.art);
  let art = toCanvas(im);
  const aspect = art.width / art.height;
  // 實際尺寸（mm）：卡片 63×88，其他依圖片比例
  let h = item.kind === 'acrylic' ? 62 : item.kind === 'sleeve' ? 120 : 88, w = h * aspect;
  if (item.kind === 'laser') { w = 63; h = 88; }
  if (item.kind === 'acrylic') art = cutWhiteBackground(art);
  const thick = item.kind === 'acrylic' ? 3 : 0.35;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x888fa0, 0.6));
  const L = (() => { const a = deg(-35), e = deg(32); return new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)).multiplyScalar(Math.max(w, h) * 0.85); })();
  const pl = new THREE.PointLight(0xffffff, 2.2, 0, 0); pl.position.copy(L); scene.add(pl);
  const outer = new THREE.Group(), inner = new THREE.Group();
  inner.position.set(-w / 2, h / 2, 0); outer.add(inner); scene.add(outer);
  const filmIdx = Math.max(0, FILMS.findIndex(f => f.id === (item.film || 'holo')));
  const printT = tex(art, true);

  if (item.kind === 'laser') {
    const shape = roundRect(w, h, 3);
    const side = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false, curveSegments: 12 }), new THREE.MeshStandardMaterial({ color: 0xf5f3ef, roughness: 0.85 }));
    side.position.z = -thick / 2; inner.add(side);
    const whiteSrc = item.mask ? toCanvas(await loadImage(item.mask)) : art;
    const front = new THREE.Mesh(new THREE.ShapeGeometry(shape, 12), material(printT, tex(whiteFromDark(whiteSrc), false), { w, h, light: L, substrate: filmIdx }));
    front.position.z = thick / 2 + 0.01; inner.add(front);
    if (item.back) {
      const bc = toCanvas(await loadImage(item.back));
      const bg = new THREE.ShapeGeometry(shape, 12); bg.rotateY(Math.PI); bg.translate(w, 0, 0);
      const back = new THREE.Mesh(bg, material(tex(bc, true), null, { w, h, light: L, flipX: w, gloss: 0.2 }));
      back.position.z = -thick / 2 - 0.01; inner.add(back);
    }
  } else if (item.kind === 'sleeve') {
    // 對折：下半＝正面（角色），上半沿虛線往後折到背面
    const yf = h * (item.fold ?? 0.5);
    const half = (y0, y1) => { const sh = new THREE.Shape(); sh.moveTo(0, -y0); sh.lineTo(w, -y0); sh.lineTo(w, -y1); sh.lineTo(0, -y1); sh.closePath(); return new THREE.ShapeGeometry(sh); };
    const whiteP = tex(alphaMask(art), true);
    const opt = { w, h, light: L, cut: true, gloss: 0.03 };
    const lower = half(yf, h), upper = half(0, yf);
    inner.add(new THREE.Mesh(lower, material(printT, null, { ...opt, side: THREE.FrontSide })));
    inner.add(new THREE.Mesh(lower, material(whiteP, null, { ...opt, side: THREE.BackSide })));
    const pivot = new THREE.Group(); pivot.position.set(0, -yf, -0.4); pivot.rotation.x = Math.PI; inner.add(pivot);
    const up1 = new THREE.Mesh(upper, material(printT, null, { ...opt, side: THREE.FrontSide })); up1.position.y = yf;
    const up2 = new THREE.Mesh(upper, material(whiteP, null, { ...opt, side: THREE.BackSide })); up2.position.y = yf;
    pivot.add(up1, up2);
    inner.position.set(-w / 2, (yf + h) / 2, 0);
    h = h - yf;
  } else {
    const shape = rect(w, h);
    const whiteT = tex(alphaMask(art), false);
    const front = new THREE.Mesh(new THREE.ShapeGeometry(shape), material(printT, whiteT, { w, h, light: L, acrylic: true, gloss: 0.9, sheet: 0 }));
    front.position.z = thick / 2; inner.add(front);
    const bg = new THREE.ShapeGeometry(shape); bg.rotateY(Math.PI); bg.translate(w, 0, 0);
    const back = new THREE.Mesh(bg, material(tex(alphaMask(art), true), whiteT, { w, h, light: L, acrylic: true, gloss: 0.9, flipX: w }));
    back.position.z = -thick / 2; inner.add(back);
  }

  const camera = new THREE.PerspectiveCamera(28, 3 / 4, 1, 5000);
  const c = { el, view, scene, camera, outer, w, h, rx: 0, ry: 0, tx: 0, ty: 0, flip: 0, flipTo: 0, hover: false, phase: index * 1.7 };
  cards.push(c); bind(c); el.classList.add('ready');
}

function bind(c) {
  const v = c.view; let down = null;
  const aim = e => { const r = v.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * 2 - 1, y = -((e.clientY - r.top) / r.height * 2 - 1); c.ty = deg(28) * Math.max(-1, Math.min(1, x)); c.tx = -deg(18) * Math.max(-1, Math.min(1, y)); };
  v.addEventListener('pointerenter', e => { c.hover = true; aim(e); });
  v.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || down) { c.hover = true; aim(e); } });
  v.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') c.hover = false; });
  v.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; c.hover = true; aim(e); if (e.pointerType !== 'mouse') v.setPointerCapture(e.pointerId); });
  const up = (e, ok) => { if (down && ok && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 10) flip(c); down = null; if (e.pointerType !== 'mouse') c.hover = false; };
  v.addEventListener('pointerup', e => up(e, true)); v.addEventListener('pointercancel', e => up(e, false));
  v.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(c); } });
  c.el.querySelector('.flip').addEventListener('click', () => flip(c));
}
function flip(c, to) {
  c.flipTo = to ?? (c.flipTo > 0.5 ? 0 : 1);
  c.el.querySelector('.flip').textContent = c.flipTo > 0.5 ? '翻回正面' : '翻面';
}
document.getElementById('flipAll').addEventListener('click', e => {
  const any = cards.some(c => c.flipTo < 0.5);
  cards.forEach((c, i) => setTimeout(() => flip(c, any ? 1 : 0), i * 70));
  e.currentTarget.textContent = any ? '全部翻回正面' : '全部翻面';
});

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const W = window.innerWidth, H = window.innerHeight, pr = renderer.getPixelRatio();
  if (canvasEl.width !== Math.round(W * pr) || canvasEl.height !== Math.round(H * pr)) renderer.setSize(W, H, false);
  renderer.setScissor(0, 0, W, H); renderer.setViewport(0, 0, W, H); renderer.clear();
  const t = now / 1000;
  for (const c of cards) {
    const ax = c.hover ? c.tx : (reduce ? 0 : deg(5) * Math.cos(t * 0.9 + c.phase));
    const ay = c.hover ? c.ty : (reduce ? 0 : deg(16) * Math.sin(t * 0.7 + c.phase));
    const k = 1 - Math.exp(-dt * (c.hover ? 10 : 3));
    c.rx += (ax - c.rx) * k; c.ry += (ay - c.ry) * k;
    const sp = dt / 0.85;
    c.flip = c.flipTo > c.flip ? Math.min(c.flipTo, c.flip + sp) : Math.max(c.flipTo, c.flip - sp);
    const e = c.flip * c.flip * (3 - 2 * c.flip);
    c.outer.rotation.set(c.rx + deg(10) * Math.sin(e * Math.PI), c.ry + e * Math.PI, 0);
    const r = c.view.getBoundingClientRect();
    if (r.bottom < 60 || r.top > H || r.right < 0 || r.left > W || r.width < 2) continue;
    // 只畫在 sticky 導覽列下方
    const top = Math.max(r.top, 60), bottom = r.bottom, x = r.left, y = H - bottom;
    renderer.setViewport(x, H - r.bottom, r.width, r.height);
    renderer.setScissor(x, y, r.width, bottom - top);
    const cam = c.camera; cam.aspect = r.width / r.height;
    const fill = 0.78, half = deg(cam.fov / 2);
    const dist = Math.max(c.h / fill / (2 * Math.tan(half)), c.w / fill / (2 * Math.tan(half) * cam.aspect));
    cam.position.set(0, 0, dist); cam.near = dist / 50; cam.far = dist * 20; cam.lookAt(0, 0, 0); cam.updateProjectionMatrix();
    renderer.render(c.scene, cam);
  }
}

const root = document.getElementById('groups');
let n = 0; const jobs = [];
for (const g of GROUPS) {
  const sec = document.createElement('section'); sec.className = 'group';
  sec.innerHTML = `<h2>${g.title}</h2><p class="sub">${g.sub}</p><div class="grid"></div>`;
  root.appendChild(sec);
  const grid = sec.querySelector('.grid');
  for (const it of g.items) {
    const fig = document.createElement('figure'); fig.className = 'card';
    fig.innerHTML = `<div class="view" role="button" tabindex="0" aria-label="${it.label}（${it.note}）：點一下翻面"><span class="ld">載入中…</span></div><figcaption><span><b>${it.label}</b><small>${it.note}</small></span><button type="button" class="flip">翻面</button></figcaption>`;
    grid.appendChild(fig);
    const i = n++;
    jobs.push(build(it, fig, i).catch(err => { fig.querySelector('.ld').textContent = '載入失敗'; console.error(err); }));
  }
}
requestAnimationFrame(frame);
</script>
